on:
  pull_request:
    branches:
      - main
  push:
  workflow_dispatch:

env:
  SDK_VER: v2.9.2
  SDK_VER_HEX: "0x02090200"
  BOARD: nrf52840dk_nrf52840
  BAUDRATE: 115200
  MCUBOOT_BAUDRATE: 1000000

jobs:
  build-r22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Clone the repo to a subdirectory, so we can initialize the Zephyr
          # workspace in the parent directory.
          path: zephyr-workspace/extra
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
           python-version: 3.13

      - name: 🧰 Install Dependencies + West
        # Install the Zephyr host build dependencies, and the `west` Python tool.
        # This list is from Zephyr's getting started guide:
        # https://docs.zephyrproject.org/latest/develop/getting_started/index.html
        run: |
          sudo apt update
          sudo apt install --no-install-recommends git cmake ninja-build gperf \
            ccache dfu-util device-tree-compiler wget \
            python3-dev python3-pip python3-setuptools python3-tk python3-wheel xz-utils file \
            make gcc gcc-multilib g++-multilib libsdl2-dev libmagic1

          pip3 install west

      - name: 🪁 Install Zephyr SDK
        # Fetch the Zephyr SDK from the GitHub Release artifact, unpack it and
        # run the setup script, selecting the '-c' option to install cmake
        # packages and the '-t arm-zephyr-eabi' option to install the toolchain
        # only for the arm-zephyr-eabi (Cortex-M) architecture, since we don't
        # need the other toolchains (xtensa, riscv, etc.)
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.9/zephyr-sdk-0.16.9_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-0.16.9_linux-x86_64_minimal.tar.xz -C ~/
          ~/zephyr-sdk-0.16.9/setup.sh -c -t arm-zephyr-eabi

      - name: 🪁 Install nRF SDK
        run: |
          mkdir -p zephyr-workspace
          git clone https://github.com/nrfconnect/sdk-nrf.git zephyr-workspace/nrf -b $SDK_VER --depth 1

      - name: 🪁 Apply overlay
        run: |
          cp zephyr-workspace/extra/$BOARD.overlay zephyr-workspace/nrf/samples/zigbee/ncp/boards/$BOARD.overlay
          cp zephyr-workspace/extra/$BOARD.conf zephyr-workspace/nrf/samples/zigbee/ncp/boards/$BOARD.conf
          sed -i "s/current-speed = \<[0-9]+\>;/current-speed = <$BAUDRATE>;/" zephyr-workspace/nrf/samples/zigbee/ncp/boards/$BOARD.overlay
          sed -i "s/current-speed = \<[0-9]+\>;/current-speed = <$MCUBOOT_BAUDRATE>;/" zephyr-workspace/extra/mcuboot.overlay
          
          HEX=${SDK_VER_HEX#0x}

          VERSION_MAJOR=$(( 0x${HEX:0:2} ))
          VERSION_MINOR=$(( 0x${HEX:2:2} ))
          PATCHLEVEL=$(( 0x${HEX:4:2} ))
          VERSION_TWEAK=$(( 0x${HEX:6:2} ))
      
          cat <<EOF > zephyr-workspace/nrf/samples/zigbee/ncp/VERSION
          VERSION_MAJOR = $VERSION_MAJOR
          VERSION_MINOR = $VERSION_MINOR
          PATCHLEVEL = $PATCHLEVEL
          VERSION_TWEAK = $VERSION_TWEAK
          EXTRAVERSION = r22
          EOF
          echo -e "\n\nzb_uint32_t zb_osif_get_fw_version(void) { return ${SDK_VER_HEX}; }" >> zephyr-workspace/nrf/samples/zigbee/ncp/src/main.c

      - name: ♻️ Initialize Zephyr Workspace
        # Set up the Zephyr workspace and install the Python dependencies
        run: |
          cd zephyr-workspace
          west init -l nrf
          west update --narrow -o=--depth=1
          pip3 install -r zephyr/scripts/requirements.txt

      - name: 🔨 Build Project
        run: |
          cd zephyr-workspace
          west build -b $BOARD --sysbuild nrf/samples/zigbee/ncp -DSB_CONFIG_BOOTLOADER_MCUBOOT=y -Dmcuboot_EXTRA_CONF_FILE=$(pwd)/extra/mcuboot.conf -Dmcuboot_DTC_OVERLAY_FILE=$(pwd)/extra/mcuboot.overlay
          mv build/merged.hex build/ncp-r22-$BOARD-$SDK_VER-$BAUDRATE-mcuboot-$MCUBOOT_BAUDRATE.hex
          unzip build/dfu_application.zip ncp.signed.bin -d build/
          mv build/ncp.signed.bin build/ncp-r22-$BOARD-$SDK_VER-$BAUDRATE.bin

      - name: 📦 Save Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            zephyr-workspace/build/*.hex
            zephyr-workspace/build/*.bin
