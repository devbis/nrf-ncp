# Override sniffer defaults: use UART1 instead of USB CDC ACM
CONFIG_USB_DEVICE_STACK=n
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=n
CONFIG_UART_LINE_CTRL=n

# Enable nRF MPSL FEM
CONFIG_MPSL=y
CONFIG_MPSL_FEM=y
CONFIG_MPSL_FEM_SIMPLE_GPIO=y

CONFIG_BOOTLOADER_MCUBOOT=y
